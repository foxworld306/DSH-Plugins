<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>hero · device</title>
<style>
  body { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: {{c_light}};
         font-family: "Poppins", "方正准圆_GBK", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  .display { font-family: "Poppins", "方正粗圆_GBK", "Microsoft YaHei", sans-serif; }

  .band { position: absolute; left: 0; top: 0; width: 1920px; height: 8px; background: {{c_dark}}; }

  /* device frame: pure decoration, the screenshot inside is baked into the background */
  .device { position: absolute; left: 940px; top: 236px; width: 820px; height: 560px;
            background: {{c_dark}}; border-radius: 18px; }
  .screen { position: absolute; left: 964px; top: 272px; width: 772px; height: 500px;
            background: {{c_light}}; border-radius: 8px; overflow: hidden; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { position: absolute; left: 972px; top: 246px; width: 8px; height: 8px; border-radius: 50%; background: #3B4A6B; }
  .dots2 { position: absolute; left: 992px; top: 246px; width: 8px; height: 8px; border-radius: 50%; background: #3B4A6B; }
  .dots3 { position: absolute; left: 1012px; top: 246px; width: 8px; height: 8px; border-radius: 50%; background: #3B4A6B; }
  .glow { position: absolute; left: 860px; top: 160px; width: 980px; height: 760px; border-radius: 50%;
          background: radial-gradient(circle at 50% 50%, rgba(119,183,252,.16), rgba(255,255,255,0) 62%); }

  .t { position: absolute; margin: 0; }
  .eyebrow { left: 164px; top: 148px; font-size: 20px; letter-spacing: .2em; color: {{c_muted}}; font-weight: 600; }
  .title   { left: 160px; top: 280px; width: 700px; font-size: 52px; line-height: 1.22; color: {{c_dark}};
             font-weight: 700; letter-spacing: -.01em; }
  .body    { left: 164px; top: 470px; width: 680px; font-size: 22px; line-height: 1.6; color: {{c_ink}}; }
  .points  { left: 164px; top: 640px; width: 680px; font-size: 24px; line-height: 1.7; color: {{c_muted}}; }
  .cap     { left: 964px; top: 806px; width: 772px; font-size: 18px; color: {{c_muted}}; }
  .foot    { left: 164px; top: 1000px; width: 700px; font-size: 16px; color: {{c_muted}}; }
</style>
</head>
<body>
  <div class="band"></div><div class="glow"></div>
  <div class="device"></div>
  <div class="dots"></div><div class="dots2"></div><div class="dots3"></div>
  <div class="screen"><img src="{{screenshot}}" alt=""></div>

  <p class="t eyebrow" data-name="Eyebrow">{{eyebrow}}</p>
  <h1 class="t title display" data-name="Title">{{title}}</h1>
  <p class="t body" data-name="Body">{{body}}</p>
  <p class="t points" data-name="Points">{{points}}</p>
  <p class="t cap" data-name="Caption">{{caption}}</p>
  <p class="t foot" data-name="Foot">{{foot}}</p>
</body>
</html>
