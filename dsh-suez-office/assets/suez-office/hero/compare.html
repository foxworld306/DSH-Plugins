<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>hero · compare</title>
<style>
  body { width: 1920px; height: 1080px; position: relative; overflow: hidden; background: {{c_light}};
         font-family: "Poppins", "方正准圆_GBK", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  .display { font-family: "Poppins", "方正粗圆_GBK", "Microsoft YaHei", sans-serif; }
  .panel-a { position: absolute; left: 160px; top: 452px; width: 760px; height: 320px; background: {{c_panel}}; }
  .panel-b { position: absolute; left: 1000px; top: 452px; width: 760px; height: 320px; background: {{c_dark}}; }
  .arrow    { position: absolute; left: 926px; top: 630px; width: 0; height: 0;
              border-left: 26px solid {{c_accent}}; border-top: 18px solid transparent; border-bottom: 18px solid transparent; }
  .rule-a   { position: absolute; left: 160px; top: 452px; width: 760px; height: 4px; background: {{c_grid}}; }
  .rule-b   { position: absolute; left: 1000px; top: 452px; width: 760px; height: 4px; background: {{c_accent}}; }
  .band     { position: absolute; left: 0; top: 0; width: 1920px; height: 8px; background: {{c_dark}}; }

  .t { position: absolute; margin: 0; }
  .eyebrow { left: 164px; top: 148px; font-size: 20px; letter-spacing: .2em; color: {{c_muted}}; font-weight: 600; }
  .title   { left: 160px; top: 280px; width: 1560px; font-size: 60px; line-height: 1.2; color: {{c_dark}};
             font-weight: 700; letter-spacing: -.01em; }
  .lab-a   { left: 200px; top: 486px; font-size: 17px; letter-spacing: .18em; color: {{c_muted}}; font-weight: 600; }
  .lab-b   { left: 1040px; top: 486px; font-size: 17px; letter-spacing: .18em; color: {{c_accent}}; font-weight: 600; }
  .h-a     { left: 200px; top: 534px; width: 660px; font-size: 34px; line-height: 1.3; color: {{c_dark}}; font-weight: 700; }
  .h-b     { left: 1040px; top: 534px; width: 660px; font-size: 34px; line-height: 1.3; color: {{c_light}}; font-weight: 700; }
  .b-a     { left: 200px; top: 606px; width: 660px; font-size: 24px; line-height: 1.55; color: {{c_ink}}; }
  .b-b     { left: 1040px; top: 606px; width: 660px; font-size: 24px; line-height: 1.55; color: {{c_tint}}; }
  .foot    { left: 164px; top: 936px; width: 1500px; font-size: 17px; color: {{c_muted}}; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="panel-a"></div><div class="panel-b"></div>
  <div class="rule-a"></div><div class="rule-b"></div><div class="arrow"></div>

  <p class="t eyebrow" data-name="Eyebrow">{{eyebrow}}</p>
  <h1 class="t title display" data-name="Title">{{title}}</h1>
  <p class="t lab-a" data-name="Before label">{{beforeLabel}}</p>
  <p class="t lab-b" data-name="After label">{{afterLabel}}</p>
  <p class="t h-a display" data-name="Before heading">{{before}}</p>
  <p class="t h-b display" data-name="After heading">{{after}}</p>
  <p class="t b-a" data-name="Before body">{{beforeBody}}</p>
  <p class="t b-b" data-name="After body">{{afterBody}}</p>
  <p class="t foot" data-name="Foot">{{foot}}</p>
</body>
</html>
